<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — Supabase</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background-color: #f3f4f6;
      display: flex;
      justify-content: center;
      padding: 30px 15px;
      margin: 0;
    }
    .container {
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 420px;
    }
    h2, h3 {
      margin-top: 0;
      color: #1f2937;
      text-align: center;
    }
    .config-box {
      background: #fffbeb;
      border: 1px solid #fde68a;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 12px;
    }
    .config-box label {
      font-weight: 600;
      color: #92400e;
      display: block;
      margin-bottom: 4px;
    }
    .config-box input {
      margin-bottom: 8px;
      font-family: monospace;
      font-size: 12px;
      padding: 6px 8px;
    }
    .form-group { margin-bottom: 12px; }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: #10b981; }
    button {
      width: 100%;
      padding: 11px;
      background-color: #10b981;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background-color: #059669; }
    button:disabled { background-color: #9ca3af; cursor: not-allowed; }
    .btn-secondary {
      background-color: #3b82f6;
      margin-top: 5px;
      padding: 7px;
      font-size: 13px;
    }
    .btn-secondary:hover { background-color: #2563eb; }
    .status {
      margin-top: 12px;
      font-size: 13px;
      text-align: center;
      padding: 8px;
      border-radius: 6px;
      display: none;
      word-break: break-word;
    }
    .error { display: block; background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .success { display: block; background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; }
    hr { border: 0; border-top: 1px solid #e5e7eb; margin: 20px 0; }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 220px;
      overflow-y: auto;
    }
    li {
      background: #f9fafb;
      padding: 10px 14px;
      margin-bottom: 8px;
      border-radius: 6px;
      border: 1px solid #e5e7eb;
      color: #374151;
      font-weight: 500;
    }
  </style>
</head>
<body>




<div class="container">
  <!-- Блок для быстрой проверки подключения (можно скрыть, когда пропишешь ключи в коде) -->
  <h2>Регистрация signup (email + пароль)</h2>
  <form id="regFormSign">
    <div class="form-group">
      <input type="email" id="signEmail" placeholder="Email" required>
    </div>
    <div class="form-group">
      <input type="password" id="signPassword" placeholder="Пароль (мин. 6 символов)" required minlength="6">
    </div>
    <button type="submit" id="signSubmitBtn">Зарегистрироваться (signUp)</button>
    <div id="signStatusMsg" class="status"></div>
  </form>
  
  <h3 style="margin-top:20px;">Пользователи signUp:</h3>
  <ul id="signUserList">
    <li style="color:#6b7280;">Пока никто не зарегистрирован через signUp</li>
  </ul>

  <h2>Регистрация insert!!!</h2>
<form id="regForm">
  <div class="form-group">
    <input type="text" id="usernameInsert" placeholder="Логин (username)" required>
  </div>
  <div class="form-group">
    <input type="password" id="passwordInsert" placeholder="Пароль (password)" required>
  </div>
  <button type="submit" id="submitBtn">Зарегистрироваться</button>
  <div id="statusMsgInsert" class="status"></div>
</form>

  <hr>

  <h3>Зарегистрированные пользователи:</h3>
  <ul id="userList">
    <li style="color: #6b7280;">Укажите ключи выше или в коде...</li>
  </ul>
</div>

  <script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'




  // Остальной JS-код страницы — здесь

  const DEFAULT_URL = 'https://fnpxkfkdzptfnpqokhwx.supabase.co';
  const DEFAULT_KEY = 'sb_publishable_LA5UVCIAZihtzEzvbq5EXQ_9MLGmu98';
  const supabase = createClient(DEFAULT_URL, DEFAULT_KEY)


  const regForm = document.getElementById('regForm');
const userList = document.getElementById('userList');
const statusMsgInsert = document.getElementById('statusMsgInsert');
const submitBtn = document.getElementById('submitBtn');

const regFormSign = document.getElementById('regFormSign');
const signUserList = document.getElementById('signUserList');
const signStatusMsg = document.getElementById('signStatusMsg');
const signSubmitBtn = document.getElementById('signSubmitBtn');



function showStatus(text, type, el = statusMsgInsert) {
  el.textContent = text;
  el.className = 'status ' + type;
}

  function getCredentials() {
  return { url: DEFAULT_URL, key: DEFAULT_KEY };
 } 

  // 1. ПОЛУЧЕНИЕ СПИСКА ПОЛЬЗОВАТЕЛЕЙ (Прямой GET-запрос к таблице users)
  async function fetchUsers() {
    const { url, key } = getCredentials();

    if (!url || !key || !url.startsWith('http')) {
      userList.innerHTML = '<li style="color: #ef4444;">Введите корректный Project URL и Key в желтом блоке сверху!</li>';
      return;
    }

    userList.innerHTML = '<li>Загрузка...</li>';

    try {
      // Обращаемся напрямую к таблице users, запрашиваем только поле username
      const response = await fetch(`${url}/rest/v1/users?select=username`, {
        method: 'GET',
        headers: {
          'apikey': key,
          'Authorization': `Bearer ${key}`
        }
      });

      if (!response.ok) {
        const errData = await response.json();
        throw new Error(errData.message || `Ошибка сервера: ${response.status}`);
      }

      const data = await response.json();
      userList.innerHTML = '';

      if (data.length === 0) {
        userList.innerHTML = '<li style="color: #9ca3af;">В таблице пока нет пользователей</li>';
        return;
      }

      // Отображаем новых сверху (разворачиваем массив)
      data.reverse().forEach(user => {
        const li = document.createElement('li');
        li.textContent = '👤 ' + (user.username || '(без имени)');
        userList.appendChild(li);
      });

    } catch (err) {
      console.error('Детали ошибки:', err);
      userList.innerHTML = `<li style="color: #dc2626;">Не удалось подключиться: ${err.message}. Проверьте URL, VPN или RLS в Supabase.</li>`;
    }
  }

  // 2. ОТПРАВКА ФОРМЫ (Прямой POST-запрос в таблицу users)
  regForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const { url, key } = getCredentials();

    if (!url || !key) {
      showStatus('Сначала заполните Project URL и Key сверху!', 'error', statusMsgInsert);
      return;
    }

    const username = document.getElementById('usernameInsert').value.trim();
const password = document.getElementById('passwordInsert').value;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Отправка...';
    statusMsg.className = 'status';

    try {
      const response = await fetch(`${url}/rest/v1/users`, {
        method: 'POST',
        headers: {
          'apikey': key,
          'Authorization': `Bearer ${key}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify({
          username: username,
          password: password
        })
      });

      if (!response.ok) {
        const errData = await response.json();
        throw new Error(errData.message || `Код ошибки: ${response.status}`);
      }

      showStatus('Пользователь успешно добавлен!', 'success',statusMsgInsert);
      regForm.reset();
      fetchUsers(); // Обновляем список снизу

    } catch (err) {
      console.error('Ошибка при отправке:', err);
      showStatus('Ошибка запроса: ' + err.message, 'error',statusMsgInsert);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Зарегистрироваться';
    }
  });



    fetchUsers();


    const channel = supabase
  .channel('table-changes')
  .on(
    'postgres_changes',
    {
      event: '*',
      schema: 'public',
      table: 'users',
    },
    () => {
      fetchUsers();
    }
  )
  .subscribe((status) => {
    console.log('Realtime:', status);
  });
  
  function showSignStatus(text, type) {
  showStatus(text, type, signStatusMsg);
}

async function fetchSignUsers() {
  try {

    const { data, error } = await supabase.auth.getSession();
    
    //console.log("hello")
    //console.log(a);
    if (error) throw error;

    signUserList.innerHTML = '';
    const user = data?.session?.user;

    if (!user) {
      signUserList.innerHTML =
        '<li style="color:#9ca3af;">Пока никто не зарегистрирован через signUp (нет активной сессии)</li>';
      return;
    }

    const li = document.createElement('li');
    li.textContent = '📧 ' + user.email + (user.email_confirmed_at ? ' ✅' : ' ⏳ (подтвердите email)');
    signUserList.appendChild(li);
  } catch (err) {
    console.error('fetchSignUsers:', err);
    signUserList.innerHTML =
      `<li style="color:#dc2626;">Ошибка: ${err.message}</li>`;
  }
}
regFormSign.addEventListener('submit', async (e) => {
  e.preventDefault();

  const email = document.getElementById('signEmail').value.trim();
  const password = document.getElementById('signPassword').value;

  signSubmitBtn.disabled = true;
  signSubmitBtn.textContent = 'Отправка...';
  signStatusMsg.className = 'status';

  try {
    const { data, error } = await supabase.auth.signUp({
      email,
      password,
      // если хочешь сразу сохранить username — можно передать в metadata:
      // options: { data: { username: email.split('@')[0] } }
    });

    if (error) throw error;

    if (data.user && !data.session) {
      showSignStatus(
        'Регистрация успешна! Проверьте почту для подтверждения email.',
        'success'
      );
    } else {
      showSignStatus('Пользователь зарегистрирован и вошёл в систему.', 'success');
    }

    regFormSign.reset();
    fetchSignUsers();
  } catch (err) {
    console.error('signUp error:', err);
    showSignStatus('Ошибка signUp: ' + err.message, 'error');
  } finally {
    signSubmitBtn.disabled = false;
    signSubmitBtn.textContent = 'Зарегистрироваться (signUp)';
  }
});

// Первичная загрузка списка signUp-пользователей
fetchSignUsers();

// Обновлять список при смене сессии (вход/выход)
supabase.auth.onAuthStateChange(() => {
  fetchSignUsers();
});
</script>

</body>
</html>
