<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Красивый сайт с галереей</title>
    <style>
        /* ========== ОБЩИЕ СТИЛИ ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ========== КАРТОЧКА ========== */
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 50px 60px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
            transform: translateY(0);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-align: center;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.4);
        }

        .icon {
            font-size: 70px;
            margin-bottom: 20px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
        }

        .subtitle {
            font-size: 1.1em;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* ========== ФИШКИ ========== */
        .features {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin: 30px 0;
        }

        .feature-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 15px;
            transition: all 0.3s ease;
        }

        .feature-item:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: scale(1.05);
        }

        .feature-item .emoji {
            font-size: 30px;
            display: block;
            margin-bottom: 5px;
        }

        .feature-item span {
            font-size: 0.9em;
            font-weight: 600;
        }

        /* ========== ГАЛЕРЕЯ ========== */
        .gallery-container {
            margin: 30px 0;
            position: relative;
        }

        #gallery {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding: 20px 10px;
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: #667eea #f0f0f0;
            border-radius: 15px;
            background: #f8f9fa;
            min-height: 200px;
        }

        #gallery::-webkit-scrollbar {
            height: 8px;
        }

        #gallery::-webkit-scrollbar-track {
            background: #f0f0f0;
            border-radius: 10px;
        }

        #gallery::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
        }

        .gallery-item {
            flex: 0 0 200px;
            height: 150px;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .gallery-item:hover {
            transform: scale(1.05) rotate(-2deg);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            z-index: 10;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .gallery-item .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
            padding: 10px;
            color: white;
            font-size: 0.8em;
            opacity: 0;
            transition: opacity 0.3s ease;
            text-align: left;
        }

        .gallery-item:hover .overlay {
            opacity: 1;
        }

        /* ========== КНОПКИ УПРАВЛЕНИЯ ========== */
        .gallery-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .gallery-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .gallery-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .counter {
            color: #666;
            font-size: 0.9em;
            margin-top: 10px;
        }

        /* ========== МОДАЛЬНОЕ ОКНО ========== */
        #modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        #modal.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        #modalImage {
            max-width: 90%;
            max-height: 80%;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: scaleIn 0.3s ease;
        }

        @keyframes scaleIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-close {
            position: absolute;
            top: 30px;
            right: 40px;
            color: white;
            font-size: 40px;
            cursor: pointer;
            transition: transform 0.3s ease;
            background: none;
            border: none;
        }

        .modal-close:hover {
            transform: rotate(90deg);
        }

        /* ========== КНОПКА ========== */
        .btn {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            margin-top: 10px;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            transition: all 0.5s ease;
        }

        .btn:hover::after {
            left: 100%;
        }

        .footer-text {
            margin-top: 25px;
            color: #999;
            font-size: 0.9em;
        }

        /* ========== АДАПТИВНОСТЬ ========== */
        @media (max-width: 600px) {
            .card {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .features {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .gallery-item {
                flex: 0 0 150px;
                height: 120px;
            }
        }
    </style>
</head>
<body>
    <!-- ====== ОСНОВНАЯ КАРТОЧКА ====== -->
    <div class="card">
        <div class="icon">🖼️</div>
        <h1>Галерея изображений</h1>
        <p class="subtitle">
            Наслаждайтесь красивыми пейзажами<br>
            и управляйте просмотром
        </p>

        <!-- Фишки -->
        <div class="features">
            <div class="feature-item">
                <span class="emoji">🎨</span>
                <span>Дизайн</span>
            </div>
            <div class="feature-item">
                <span class="emoji">⚡</span>
                <span>Скорость</span>
            </div>
            <div class="feature-item">
                <span class="emoji">❤️</span>
                <span>Качество</span>
            </div>
        </div>

        <!-- ГАЛЕРЕЯ -->
        <div class="gallery-container">
            <div id="gallery"></div>
            <div class="gallery-controls">
                <button class="gallery-btn" onclick="scrollGallery(-1)">◀ Назад</button>
                <button class="gallery-btn" onclick="scrollGallery(1)">Вперед ▶</button>
            </div>
            <div class="counter" id="counter">0 / 0</div>
        </div>

        <a href="#" class="btn">Исследовать</a>
        <p class="footer-text">Сделано с 💜 для вдохновения</p>
    </div>

    <!-- ====== МОДАЛЬНОЕ ОКНО ====== -->
    <div id="modal">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <img id="modalImage" src="" alt="Увеличенное изображение">
    </div>

    <!-- ====== ПОДКЛЮЧЕНИЕ JAVASCRIPT ====== -->
    <script src="script.js"></script>
</body>
</html>
